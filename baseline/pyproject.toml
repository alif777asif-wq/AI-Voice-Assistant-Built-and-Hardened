[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l-voice-assistant"
version = "1.0.0"
description = "Cross-platform, fully local, offline-capable AI voice assistant (Linux + Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See README.md -- this project depends on GPL-3.0 licensed components (Piper TTS)." }
authors = [{ name = "L project" }]

dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.9",
    "platformdirs>=4.3",
    "sounddevice>=0.5.1",
    "numpy>=1.26,<3.0",
    "webrtcvad-wheels>=2.0.14",
    # openwakeword is deliberately NOT listed here -- it must be installed
    # separately with `pip install --no-deps openwakeword>=0.6.0` because
    # its current PyPI release has a broken unconditional tflite-runtime
    # dependency on Linux. See requirements.txt for the full explanation.
    # These four are openwakeword's actual runtime dependencies:
    "onnxruntime>=1.19",
    "tqdm>=4.0,<5.0",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
    "faster-whisper>=1.1.0",
    "piper-tts>=1.6.0",
    "httpx>=0.27",
    "rich>=13.9",
    "pystray>=0.19.5",
    "tendo>=0.3.0",
    "pillow>=10.4",
    # file_operation's delete action moves to the OS trash/recycle bin
    # instead of a permanent delete -- pure Python, no C extension.
    "send2trash>=1.8.3",
    # play_youtube_search's direct-video-URL resolver.
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
build = ["pyinstaller>=6.10"]

[project.scripts]
l = "l_assistant.main:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
